<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      .task-list {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 600px;
        padding: 10px;
      }
      .checkbox {
        align-self: flex-start;
      }
      .btn-div {
        width: 100px;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        align-self: flex-end;
      }
    </style>
  </head>
  <body>
    <div class="h-screen w-screen">
      <div class="taskbox flex justify-center items-center min-h-0 flex-col">
        <div class="task-frame">
          <input
            id="task-input"
            type="text"
            placeholder="Add new task"
            class="bg-green-200 px-40 py-2 rounded-xl border-2 border-black text-center text-black"
          />
          <button
            id="add-button"
            class="bg-green-600 px-12 py-2 m-5 rounded-xl border-2 border-black font-mono font-bold"
          >
            Add
          </button>
        </div>
      </div>
      <div class="detail-tab flex justify-center items-center h-1/2">
        <button
          class="all bg-green-600 px-12 py-2 m-5 rounded-xl border-2 border-black font-mono font-bold"
        >
          All
        </button>
        <button
          class="completed bg-green-600 px-12 py-2 m-5 rounded-xl border-2 border-black font-mono font-bold"
        >
          Completed
        </button>
      </div>
    </div>
    <script src="15_dom.js"></script>
  </body>
</html>
